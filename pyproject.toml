[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metapy"
version = "5.0.0"
description = "Intelligent, transparent meta-analysis assistant: CSV/Excel in, derivation-audited analysis and Word/Excel/PDF reports out."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sadia Nadeem"}]
readme = "README.md"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "openpyxl>=3.1",
                "python-docx>=1.1", "reportlab>=4.0", "pillow>=9"]

[project.optional-dependencies]
app = ["gradio>=5,<7"]

[project.scripts]
metapy = "metapy.app:launch"

[tool.setuptools.packages.find]
include = ["metapy*"]
